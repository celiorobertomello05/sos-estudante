name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      # Versao do pnpm vem de packageManager no package.json (mesma do EAS).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checagem de tipos
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Testes de caracterização
        run: pnpm run test:characterization
      - name: Export Android
        run: pnpm run export:android
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high
      - name: Busca de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
